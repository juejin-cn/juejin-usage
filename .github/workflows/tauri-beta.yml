name: Tauri next Windows candidate
on:
  push:
    branches: [chore/tauri-next-2.0.0-next.2]
  workflow_dispatch:
    inputs:
      version:
        description: Explicit beta version (e.g. 2.0.0-next.2)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: tauri-beta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      BUILD_PROFILE: release
      TUD_RELEASE_CHANNEL: beta
      BETA_VERSION: ${{ inputs.version || '2.0.0-next.2' }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_BETA_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_BETA_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      TUD_WINDOWS_CERTIFICATE: ${{ secrets.TUD_WINDOWS_CERTIFICATE || '' }}
      TUD_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.TUD_WINDOWS_CERTIFICATE_PASSWORD || '' }}
      TUD_UPDATER_PUBLIC_KEY: ${{ vars.TUD_BETA_UPDATER_PUBLIC_KEY || '' }}
      TUD_UPDATER_URL: https://gitee.com/juejin-cn/juejin-usage/raw/main/releases/tauri-beta/latest.json
      TUD_WINDOWS_TIMESTAMP_URL: ${{ vars.TUD_WINDOWS_TIMESTAMP_URL || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/desktop-tauri/.node-version
          cache: pnpm
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare isolated beta version
        shell: bash
        run: node apps/desktop-tauri/scripts/prepare-beta.mjs "$BETA_VERSION"
      - name: Check version consistency
        run: pnpm --filter @juejin-opensource/jusage-desktop-tauri version:check
      - name: Import Windows signing certificate for explicit release candidates
        if: runner.os == 'Windows' && env.TUD_WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'tauri-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:TUD_WINDOWS_CERTIFICATE))
            $password = if ($env:TUD_WINDOWS_CERTIFICATE_PASSWORD) { ConvertTo-SecureString $env:TUD_WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force } else { [Security.SecureString]::new() }
            $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password | Where-Object HasPrivateKey | Select-Object -First 1
            if (!$certificate) { throw 'No private signing certificate was imported' }
            "TUD_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          } finally { Remove-Item $path -ErrorAction SilentlyContinue }
      - name: Build release installer candidate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        shell: bash
        run: |
          # Only the temporary runner file contains the P8 key; never echo it.
          if [[ "$RUNNER_OS" == "macOS" && -n "$APPLE_API_PRIVATE_KEY" ]]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/jusage-beta-notary.p8"
            python3 - <<'PY'
          import os
          fd = os.open(os.environ['APPLE_API_KEY_PATH'], os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, 'w') as f:
              f.write(os.environ['APPLE_API_PRIVATE_KEY'])
          PY
            trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          unset APPLE_API_PRIVATE_KEY
          pnpm --filter @juejin-opensource/jusage-desktop-tauri bundle:release
      - name: Test host and bridge
        run: pnpm test:desktop:tauri
      - name: Test staged Node runtime
        run: pnpm --filter @juejin-opensource/jusage-desktop-tauri test:staged
      - name: Test extracted/packaged runtime
        run: pnpm --filter @juejin-opensource/jusage-desktop-tauri test:packaged ${{ env.BUILD_PROFILE }}
      - name: Test Rust lifecycle and proxy
        run: cargo test --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml --locked --features custom-protocol
      - name: Compare Rust daily with frozen Node API responses
        run: pnpm --filter @juejin-opensource/jusage-desktop-tauri golden:rust
      - name: Collect installer checksums
        run: pnpm --filter @juejin-opensource/jusage-desktop-tauri artifacts ${{ env.BUILD_PROFILE }}
      - uses: actions/upload-artifact@v7
        with:
          name: tauri-next-${{ env.BETA_VERSION }}-${{ matrix.target }}
          path: apps/desktop-tauri/artifacts/
          if-no-files-found: error
          retention-days: 30
