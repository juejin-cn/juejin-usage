name: 🚀 同步 Release 到 Gitee

# 只同步 tag / 标题 / 说明。安装包由人手动传到 Gitee 发行版，本 Job 不下载、不上传附件。
on:
  release:
    types: [published, edited]

jobs:
  sync-release-meta:
    runs-on: ubuntu-latest
    steps:
      - name: 同步 Gitee 发行版元数据（不传附件）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: juejin-cn
          GITEE_REPO: juejin-usage
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          owner = os.environ["GITEE_OWNER"]
          repo = os.environ["GITEE_REPO"]
          token = os.environ["GITEE_TOKEN"]
          tag = os.environ["TAG_NAME"]
          name = os.environ.get("RELEASE_NAME") or tag
          body = os.environ.get("RELEASE_BODY") or ""
          prerelease = os.environ.get("PRERELEASE", "false").lower() == "true"
          target = os.environ.get("TARGET_COMMITISH") or "main"
          base = f"https://gitee.com/api/v5/repos/{owner}/{repo}/releases"

          def request(method: str, url: str, payload: dict | None = None) -> tuple[int, dict | None]:
              data = None
              headers = {"Accept": "application/json"}
              if payload is not None:
                  body_bytes = json.dumps(payload, ensure_ascii=False).encode()
                  data = body_bytes
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read().decode()
                      return resp.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as err:
                  raw = err.read().decode() if err.fp else ""
                  parsed = None
                  if raw:
                      try:
                          parsed = json.loads(raw)
                      except json.JSONDecodeError:
                          parsed = {"message": raw}
                  return err.code, parsed

          print(f"sync Gitee release meta: {owner}/{repo} {tag}")
          encoded_tag = urllib.parse.quote(tag, safe="")
          status, existing = request(
              "GET",
              f"{base}/tags/{encoded_tag}?access_token={urllib.parse.quote(token)}",
          )
          if status == 200 and existing and existing.get("id"):
              release_id = existing["id"]
              patch_status, patched = request(
                  "PATCH",
                  f"{base}/{release_id}",
                  {
                      "access_token": token,
                      "tag_name": tag,
                      "name": name,
                      "body": body,
                      "prerelease": prerelease,
                  },
              )
              if patch_status >= 300:
                  print(f"update failed HTTP {patch_status}: {patched}", file=sys.stderr)
                  sys.exit(1)
              print(f"updated Gitee release id={release_id} tag={tag}")
              sys.exit(0)

          if status not in (404, 200):
              print(f"lookup failed HTTP {status}: {existing}", file=sys.stderr)
              sys.exit(1)

          create_status, created = request(
              "POST",
              base,
              {
                  "access_token": token,
                  "tag_name": tag,
                  "name": name,
                  "body": body,
                  "prerelease": prerelease,
                  "target_commitish": target,
              },
          )
          if create_status >= 300:
              print(f"create failed HTTP {create_status}: {created}", file=sys.stderr)
              print(
                  "若提示 tag 不存在：等 Gitee 镜像完 GitHub 的 tag 后再重跑本 Job。安装包请手动传到 Gitee 发行版。",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"created Gitee release id={created.get('id') if created else '?'} tag={tag}")
          PY
