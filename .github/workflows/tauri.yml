name: Tauri migration
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop-tauri/**'
      - 'apps/desktop/src/shared/desktop-pet-*'
      - 'apps/desktop/src/renderer/assets/pets/**'
      - 'packages/core/**'
      - 'packages/dashboard/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/tauri.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: Candidate build profile (artifacts only, no publication)
        type: choice
        options: [debug, release]
        default: release
permissions:
  contents: read
concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    env:
      BUILD_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'debug' }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check version consistency
        run: pnpm --filter @juejin-opensource/jusage-desktop-tauri version:check
      - name: Build native installer candidate (unsigned)
        shell: bash
        run: |
          if [ "$BUILD_PROFILE" = debug ]; then
            pnpm --filter @juejin-opensource/jusage-desktop-tauri bundle --debug
          else
            pnpm --filter @juejin-opensource/jusage-desktop-tauri bundle
          fi
      - name: Test host and bridge
        run: pnpm test:desktop:tauri
      - name: Test staged Node runtime
        run: pnpm --filter @juejin-opensource/jusage-desktop-tauri test:staged
      - name: Test Rust lifecycle and proxy
        run: cargo test --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml --locked --features custom-protocol
      - name: Collect installer checksums
        run: pnpm --filter @juejin-opensource/jusage-desktop-tauri artifacts ${{ env.BUILD_PROFILE }}
      - uses: actions/upload-artifact@v7
        with:
          name: tauri-${{ matrix.target }}-${{ env.BUILD_PROFILE }}
          path: apps/desktop-tauri/artifacts/
          if-no-files-found: error
          retention-days: 14
