name: Tauri migration
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop-tauri/**'
      - 'packages/core/**'
      - 'packages/dashboard/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/tauri.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS native build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native app (unsigned development bundle)
        run: pnpm --filter @juejin-opensource/jusage-desktop-tauri bundle --debug --bundles app
      - name: Test host and bridge
        run: pnpm test:desktop:tauri
      - name: Test bundled Node runtime
        run: pnpm --filter @juejin-opensource/jusage-desktop-tauri test:staged
      - name: Test Rust proxy validation
        run: cargo test --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml --locked --features custom-protocol
