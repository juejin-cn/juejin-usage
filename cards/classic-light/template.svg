<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="Classic Light 用量卡">
<defs>
<linearGradient id="a-accent" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#087FFA">
</stop>
<stop offset="100%" stop-color="#3B9BFF">
</stop>
</linearGradient>
</defs>
<rect width="420" height="200" rx="14" fill="#FFFFFF" stroke="#E5EAF2" stroke-width="1">
</rect>
<rect x="0" y="0" width="5" height="200" rx="0" fill="#087FFA">
</rect>
{{avatar}}
<text x="64" y="32" fill="#1A1D24" font-size="14" font-weight="600" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">{{name}}</text>
<text x="64" y="48" fill="#8B93A7" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">{{subtitle}}</text>
<text x="28" y="88" fill="#8B93A7" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">总 Token</text>
<text x="28" y="118" fill="#1A1D24" font-size="24" font-weight="650" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="-0.5">{{total}}</text>
<text x="168" y="88" fill="#8B93A7" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">累计费用</text>
<text x="168" y="118" fill="#087FFA" font-size="24" font-weight="650" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="-0.5">{{cost}}</text>
<text x="308" y="88" fill="#8B93A7" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">今日 Token</text>
<text x="308" y="118" fill="#1A1D24" font-size="22" font-weight="600" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{{today}}</text>
<line x1="28" y1="148" x2="392" y2="148" stroke="#EEF1F6" stroke-width="1">
</line>
<text x="28" y="172" fill="#A0A8B8" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">掘金 AI Usage</text>
<text x="392" y="172" text-anchor="end" fill="#A0A8B8" font-size="11" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{{since}}</text>
</svg>
